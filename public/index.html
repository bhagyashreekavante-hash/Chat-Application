<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexChat — Real-time</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
<script src="/socket.io/socket.io.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0a0a0f;
  --surface:   #111118;
  --panel:     #16161f;
  --border:    #1e1e2e;
  --accent:    #7c3aed;
  --accent2:   #06b6d4;
  --neon:      #a78bfa;
  --text:      #e2e8f0;
  --muted:     #64748b;
  --danger:    #ef4444;
  --success:   #22c55e;
  --font-body: 'Syne', sans-serif;
  --font-mono: 'Space Mono', monospace;
  --radius:    12px;
  --glow:      0 0 20px rgba(124,58,237,.35);
}

html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-body); }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

#landing {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 60% 40% at 50% -10%, rgba(124,58,237,.18) 0%, transparent 70%),
    radial-gradient(ellipse 40% 30% at 80% 80%, rgba(6,182,212,.12) 0%, transparent 60%);
}

.join-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 48px 44px;
  width: 420px;
  max-width: 94vw;
  box-shadow: 0 0 60px rgba(124,58,237,.15), 0 24px 48px rgba(0,0,0,.4);
  animation: cardIn .5s cubic-bezier(.16,1,.3,1);
}
@keyframes cardIn {
  from { opacity:0; transform: translateY(24px) scale(.97); }
  to   { opacity:1; transform: translateY(0) scale(1); }
}

.join-logo {
  font-size: 2rem; font-weight: 800; letter-spacing: -1px;
  background: linear-gradient(135deg, var(--neon), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 6px;
}
.join-sub { color: var(--muted); font-size: .85rem; margin-bottom: 36px; font-family: var(--font-mono); }

.field { margin-bottom: 18px; }
.field label { display: block; font-size: .75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.field input, .field select {
  width: 100%; background: var(--panel); border: 1px solid var(--border);
  color: var(--text); border-radius: var(--radius);
  padding: 12px 16px; font-family: var(--font-body); font-size: .95rem;
  outline: none; transition: border-color .2s, box-shadow .2s;
}
.field input:focus, .field select:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,58,237,.15);
}
.field select option { background: var(--panel); }

.avatar-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.avatar-btn {
  width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--border);
  background: var(--panel); font-size: 1.2rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, transform .15s;
}
.avatar-btn:hover { border-color: var(--accent); transform: scale(1.1); }
.avatar-btn.selected { border-color: var(--neon); box-shadow: 0 0 12px rgba(167,139,250,.4); }

.join-btn {
  width: 100%; margin-top: 10px; padding: 14px;
  background: linear-gradient(135deg, var(--accent), #5b21b6);
  color: #fff; font-family: var(--font-body); font-size: 1rem; font-weight: 700;
  border: none; border-radius: var(--radius); cursor: pointer;
  letter-spacing: .5px; transition: opacity .2s, transform .15s;
  box-shadow: var(--glow);
}
.join-btn:hover { opacity: .9; transform: translateY(-1px); }

#app {
  display: none; height: 100vh;
  display: grid;
  grid-template-columns: 240px 1fr 220px;
  grid-template-rows: 56px 1fr;
  grid-template-areas: "sidebar header members" "sidebar main members";
}

#header {
  grid-area: header;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; gap: 16px;
}
.room-name { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
.room-name .hash { color: var(--accent); font-size: 1.1rem; }
.header-status { font-size: .78rem; color: var(--muted); font-family: var(--font-mono); }
.header-right { display: flex; align-items: center; gap: 12px; }
.user-chip {
  display: flex; align-items: center; gap: 8px;
  background: var(--panel); border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 999px; font-size: .82rem;
}
.user-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 6px var(--success); }

#sidebar {
  grid-area: sidebar;
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-logo {
  padding: 16px 20px; font-size: 1.2rem; font-weight: 800;
  background: linear-gradient(135deg, var(--neon), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  border-bottom: 1px solid var(--border);
}
.sidebar-section { padding: 16px 12px 8px; font-size: .68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }
.room-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 16px; cursor: pointer; border-radius: 8px; margin: 0 6px 2px;
  font-size: .9rem; color: var(--muted); transition: background .15s, color .15s;
}
.room-item:hover { background: var(--panel); color: var(--text); }
.room-item.active { background: rgba(124,58,237,.15); color: var(--neon); font-weight: 600; }
.room-item .r-hash { color: var(--accent); margin-right: 2px; }

#members {
  grid-area: members;
  background: var(--surface); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.members-header { padding: 16px; font-size: .68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 1px solid var(--border); }
.members-list { flex: 1; overflow-y: auto; padding: 10px 8px; }
.member-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px; font-size: .85rem; transition: background .15s;
}
.member-item:hover { background: var(--panel); }
.member-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--panel); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: .9rem; flex-shrink: 0; }
.member-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member-online { width: 7px; height: 7px; border-radius: 50%; background: var(--success); margin-left: auto; flex-shrink: 0; }

#main {
  grid-area: main; background: var(--bg);
  display: flex; flex-direction: column; overflow: hidden;
  background-image: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(124,58,237,.04) 0%, transparent 70%);
}

#messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 2px; }

.msg-row { display: flex; align-items: flex-start; gap: 12px; animation: msgIn .25s cubic-bezier(.16,1,.3,1); margin-bottom: 14px; }
@keyframes msgIn {
  from { opacity:0; transform: translateY(8px); }
  to   { opacity:1; transform: translateY(0); }
}

.msg-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--panel); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; margin-top: 2px; }
.msg-body { flex: 1; }
.msg-meta { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.msg-author { font-size: .88rem; font-weight: 700; color: var(--neon); }
.msg-author.self { color: var(--accent2); }
.msg-time { font-size: .68rem; color: var(--muted); font-family: var(--font-mono); }
.msg-bubble {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px 14px 14px 14px;
  padding: 10px 14px; font-size: .9rem; line-height: 1.55;
  display: inline-block; max-width: 560px; word-break: break-word;
  transition: border-color .2s;
}
.msg-bubble:hover { border-color: var(--accent); }
.msg-bubble.self { background: rgba(124,58,237,.12); border-color: rgba(124,58,237,.3); }

.msg-row.self { flex-direction: row-reverse; }
.msg-row.self .msg-body { display: flex; flex-direction: column; align-items: flex-end; }
.msg-row.self .msg-meta { flex-direction: row-reverse; }
.msg-row.self .msg-bubble { border-radius: 14px 4px 14px 14px; }

.system-msg {
  text-align: center; font-size: .75rem; color: var(--muted);
  font-family: var(--font-mono); padding: 6px 0;
}

.reactions { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.reaction-pill {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 999px; padding: 2px 8px 2px 6px;
  font-size: .78rem; cursor: pointer; transition: border-color .15s, background .15s;
  display: flex; align-items: center; gap: 3px;
}
.reaction-pill:hover { border-color: var(--accent); background: rgba(124,58,237,.1); }

.reply-preview {
  border-left: 2px solid var(--accent); padding: 4px 10px; margin-bottom: 6px;
  font-size: .78rem; color: var(--muted); background: rgba(124,58,237,.06); border-radius: 0 6px 6px 0;
}

#typing-bar { height: 22px; padding: 0 24px; font-size: .75rem; color: var(--muted); font-family: var(--font-mono); display: flex; align-items: center; gap: 6px; }
.typing-dots { display: flex; gap: 3px; }
.typing-dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: blink 1.2s ease infinite; }
.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

#input-area { padding: 14px 20px 18px; border-top: 1px solid var(--border); background: var(--surface); }
.reply-chip {
  display: flex; align-items: center; gap: 10px;
  background: rgba(124,58,237,.1); border: 1px solid rgba(124,58,237,.25);
  border-radius: 8px; padding: 7px 12px; margin-bottom: 10px; font-size: .8rem; color: var(--muted);
}
.reply-chip strong { color: var(--neon); }
.reply-cancel { margin-left: auto; cursor: pointer; color: var(--muted); font-size: 1rem; }
.reply-cancel:hover { color: var(--danger); }

.input-row { display: flex; gap: 10px; align-items: flex-end; }
#msg-input {
  flex: 1; background: var(--panel); border: 1px solid var(--border);
  color: var(--text); border-radius: var(--radius);
  padding: 12px 16px; font-family: var(--font-body); font-size: .95rem;
  outline: none; resize: none; min-height: 44px; max-height: 120px; overflow-y: auto;
  transition: border-color .2s, box-shadow .2s; line-height: 1.5;
}
#msg-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,58,237,.12); }
#msg-input::placeholder { color: var(--muted); }

.emoji-btn, .send-btn {
  width: 44px; height: 44px; border-radius: var(--radius); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
  flex-shrink: 0; transition: opacity .15s, transform .15s;
}
.emoji-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
.emoji-btn:hover { background: var(--border); }
.send-btn { background: linear-gradient(135deg, var(--accent), #5b21b6); color: #fff; box-shadow: var(--glow); }
.send-btn:hover { opacity: .9; transform: scale(1.05); }

.emoji-picker {
  position: absolute; bottom: 80px; right: 20px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 14px; padding: 12px; display: flex; flex-wrap: wrap; gap: 6px;
  width: 260px; box-shadow: 0 16px 40px rgba(0,0,0,.4); z-index: 50;
}
.emoji-picker span { font-size: 1.3rem; cursor: pointer; border-radius: 6px; padding: 4px 6px; transition: background .1s; }
.emoji-picker span:hover { background: var(--border); }

.ctx-menu {
  position: fixed; background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 6px; z-index: 200;
  box-shadow: 0 16px 40px rgba(0,0,0,.5); min-width: 160px;
}
.ctx-item { padding: 8px 12px; border-radius: 7px; cursor: pointer; font-size: .85rem; display: flex; gap: 10px; align-items: center; transition: background .1s; }
.ctx-item:hover { background: var(--border); }

#conn-banner {
  display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 300;
  background: var(--danger); color: #fff; text-align: center;
  padding: 8px; font-size: .82rem; font-family: var(--font-mono);
}

@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; grid-template-areas: "header" "main"; }
  #sidebar, #members { display: none; }
}
</style>
</head>
<body>

<div id="conn-banner">⚡ Reconnecting to server…</div>

<div id="landing">
  <div class="join-card">
    <div class="join-logo">NexChat</div>
    <div class="join-sub">// real-time · socket.io · open channels</div>
    <div class="field">
      <label>Username</label>
      <input id="username-input" type="text" placeholder="name" maxlength="24" />
    </div>
    <div class="field">
      <label>Your Avatar</label>
      <div class="avatar-row" id="avatar-row"></div>
    </div>
    <div class="field">
      <label>Start in room</label>
      <select id="room-select">
        <option value="general"># general</option>
        <option value="random"># random</option>
        <option value="tech"># tech</option>
        <option value="music"># music</option>
      </select>
    </div>
    <button class="join-btn" onclick="joinChat()">Enter Chat →</button>
  </div>
</div>

<div id="app" style="display:none">
  <aside id="sidebar">
    <div class="sidebar-logo">⚡ NexChat</div>
    <div class="sidebar-section">Channels</div>
    <div id="room-list"></div>
  </aside>

  <header id="header">
    <div class="room-name"><span class="hash">#</span><span id="header-room">general</span></div>
    <div class="header-status" id="online-count">0 online</div>
    <div class="header-right">
      <div class="user-chip">
        <span class="dot"></span>
        <span id="self-name">—</span>
      </div>
    </div>
  </header>

  <main id="main">
    <div id="messages"></div>
    <div id="typing-bar"></div>
    <div id="input-area" style="position:relative">
      <div id="reply-chip" style="display:none" class="reply-chip">
        <span>↩ Replying to <strong id="reply-author"></strong>: <em id="reply-text"></em></span>
        <span class="reply-cancel" onclick="clearReply()">✕</span>
      </div>
      <div class="input-row">
        <textarea id="msg-input" rows="1" placeholder="Message #general…"></textarea>
        <button class="emoji-btn" onclick="toggleEmoji(event)">😊</button>
        <button class="send-btn" onclick="sendMessage()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div id="emoji-picker" style="display:none" class="emoji-picker"></div>
    </div>
  </main>

  <aside id="members">
    <div class="members-header">Members</div>
    <div class="members-list" id="members-list"></div>
  </aside>
</div>

<div id="ctx-menu" style="display:none" class="ctx-menu"></div>

<script>
const AVATARS = ['🦊','🐼','🦁','🐸','🤖','👾','🦄','🐙','🦋','🐉','🌙','⚡'];
const EMOJIS  = ['😂','😍','🔥','👍','❤️','😭','🎉','💯','🤔','👀','😎','🙌','💀','🚀','⭐','✨','😤','🫡','💜','🤯'];

let socket, me = {}, currentRoom = 'general', replyTarget = null, typingTimer;
let emojiOpen = false;
const typingUsers = new Set();
const msgIndex = {};

const avatarRow = document.getElementById('avatar-row');
AVATARS.forEach(a => {
  const btn = document.createElement('button');
  btn.className = 'avatar-btn'; btn.textContent = a;
  btn.onclick = () => {
    document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected'); me.avatar = a;
  };
  avatarRow.appendChild(btn);
});
avatarRow.firstChild.classList.add('selected'); me.avatar = AVATARS[0];

const picker = document.getElementById('emoji-picker');
EMOJIS.forEach(e => {
  const s = document.createElement('span'); s.textContent = e;
  s.onclick = () => { insertEmoji(e); toggleEmoji(); };
  picker.appendChild(s);
});

function buildRoomList() {
  const el = document.getElementById('room-list');
  el.innerHTML = '';
  ['general','random','tech','music'].forEach(r => {
    const d = document.createElement('div');
    d.className = 'room-item' + (r === currentRoom ? ' active' : '');
    d.id = `room-${r}`;
    d.innerHTML = `<span class="r-hash">#</span>${r}`;
    d.onclick = () => switchRoom(r);
    el.appendChild(d);
  });
}

function joinChat() {
  const username = document.getElementById('username-input').value.trim();
  if (!username) { alert('Please enter a username.'); return; }
  const room = document.getElementById('room-select').value;
  me = { username, avatar: me.avatar, room };
  currentRoom = room;
  document.getElementById('landing').style.display = 'none';
  document.getElementById('app').style.display = 'grid';
  document.getElementById('self-name').textContent = username;
  document.getElementById('header-room').textContent = currentRoom;
  document.querySelector('#msg-input').placeholder = `Message #${currentRoom}…`;
  buildRoomList();
  initSocket();
}

function initSocket() {
  socket = io("http://localhost:3000");

  socket.on('connect', () => {
    document.getElementById('conn-banner').style.display = 'none';
    socket.emit('join', me);
  });

  socket.on('disconnect', () => {
    document.getElementById('conn-banner').style.display = 'block';
  });

  socket.on('history', msgs => {
    const el = document.getElementById('messages');
    el.innerHTML = '';
    msgs.forEach(renderMsg);
    el.scrollTop = el.scrollHeight;
  });

  socket.on('message', msg => { renderMsg(msg); scrollToBottom(); });
  socket.on('system_msg', msg => { renderMsg(msg); scrollToBottom(); });

  socket.on('user_list', users => {
    document.getElementById('online-count').textContent = `${users.length} online`;
    const list = document.getElementById('members-list');
    list.innerHTML = '';
    users.forEach(u => {
      const d = document.createElement('div'); d.className = 'member-item';
      const isSelf = u.username === me.username;
      d.innerHTML = `
        <div class="member-avatar">${u.avatar}</div>
        <div class="member-name">${u.username}${isSelf ? ' (you)' : ''}</div>
        <div class="member-online"></div>`;
      list.appendChild(d);
    });
  });

  socket.on('typing', ({ username, isTyping }) => {
    if (username === me.username) return;
    isTyping ? typingUsers.add(username) : typingUsers.delete(username);
    updateTypingBar();
  });

  socket.on('reaction', ({ msgId, emoji }) => {
    const row = document.querySelector(`[data-id="${msgId}"]`);
    if (!row) return;
    let rxContainer = row.querySelector('.reactions');
    if (!rxContainer) {
      rxContainer = document.createElement('div'); rxContainer.className = 'reactions';
      row.querySelector('.msg-bubble').after(rxContainer);
    }
    let pill = [...rxContainer.querySelectorAll('.reaction-pill')].find(p => p.dataset.emoji === emoji);
    if (!pill) {
      pill = document.createElement('div'); pill.className = 'reaction-pill';
      pill.dataset.emoji = emoji;
      pill.innerHTML = `${emoji} <span>1</span>`;
      rxContainer.appendChild(pill);
    } else {
      const cnt = pill.querySelector('span');
      cnt.textContent = parseInt(cnt.textContent) + 1;
    }
  });
}

function renderMsg(msg) {
  const container = document.getElementById('messages');
  if (msg.type === 'system') {
    const d = document.createElement('div'); d.className = 'system-msg';
    d.textContent = msg.text; container.appendChild(d); return;
  }
  const isSelf = msg.socketId === socket.id;
  const row = document.createElement('div');
  row.className = 'msg-row' + (isSelf ? ' self' : '');
  row.dataset.id = msg.id;
  const ts = new Date(msg.ts);
  const timeStr = ts.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  let replyHtml = '';
  if (msg.replyTo && msgIndex[msg.replyTo]) {
    const r = msgIndex[msg.replyTo];
    replyHtml = `<div class="reply-preview">↩ <strong>${r.username}</strong>: ${escHtml(r.text.slice(0,60))}</div>`;
  }
  row.innerHTML = `
    <div class="msg-avatar">${msg.avatar}</div>
    <div class="msg-body">
      <div class="msg-meta">
        <span class="msg-author${isSelf?' self':''}">${escHtml(msg.username)}</span>
        <span class="msg-time">${timeStr}</span>
      </div>
      ${replyHtml}
      <div class="msg-bubble${isSelf?' self':''}">${escHtml(msg.text)}</div>
    </div>`;
  row.addEventListener('contextmenu', e => { e.preventDefault(); showCtxMenu(e.clientX, e.clientY, msg); });
  container.appendChild(row);
  msgIndex[msg.id] = { username: msg.username, text: msg.text };
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  socket.emit('message', { text, replyTo: replyTarget?.id || null });
  input.value = ''; input.style.height = '';
  clearReply();
  socket.emit('typing', { isTyping: false });
}

document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('msg-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  socket.emit('typing', { isTyping: true });
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => socket.emit('typing', { isTyping: false }), 2000);
});

function switchRoom(room) {
  if (room === currentRoom) return;
  currentRoom = room;
  document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`room-${room}`).classList.add('active');
  document.getElementById('header-room').textContent = room;
  document.getElementById('msg-input').placeholder = `Message #${room}…`;
  document.getElementById('messages').innerHTML = '';
  document.getElementById('members-list').innerHTML = '';
  socket.emit('switch_room', { room });
}

function setReply(msg) {
  replyTarget = msg;
  document.getElementById('reply-chip').style.display = 'flex';
  document.getElementById('reply-author').textContent = msg.username;
  document.getElementById('reply-text').textContent = msg.text.slice(0, 60);
  document.getElementById('msg-input').focus();
}
function clearReply() {
  replyTarget = null;
  document.getElementById('reply-chip').style.display = 'none';
}

function showCtxMenu(x, y, msg) {
  const menu = document.getElementById('ctx-menu');
  menu.innerHTML = '';
  const items = [
    { icon:'↩', label:'Reply', fn: () => setReply(msg) },
    { icon:'😊', label:'React', fn: () => socket.emit('react', { msgId: msg.id, emoji: EMOJIS[Math.floor(Math.random()*6)] }) },
    { icon:'📋', label:'Copy text', fn: () => navigator.clipboard.writeText(msg.text) },
  ];
  items.forEach(({ icon, label, fn }) => {
    const d = document.createElement('div'); d.className = 'ctx-item';
    d.innerHTML = `<span>${icon}</span>${label}`;
    d.onclick = () => { fn(); hideCtxMenu(); };
    menu.appendChild(d);
  });
  menu.style.display = 'block';
  menu.style.left = Math.min(x, window.innerWidth - 180) + 'px';
  menu.style.top  = Math.min(y, window.innerHeight - 120) + 'px';
}
function hideCtxMenu() { document.getElementById('ctx-menu').style.display = 'none'; }
document.addEventListener('click', hideCtxMenu);

function updateTypingBar() {
  const bar = document.getElementById('typing-bar');
  if (typingUsers.size === 0) { bar.innerHTML = ''; return; }
  const names = [...typingUsers].join(', ');
  bar.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>${escHtml(names)} ${typingUsers.size === 1 ? 'is' : 'are'} typing…`;
}

function toggleEmoji(e) {
  if (e) e.stopPropagation();
  emojiOpen = !emojiOpen;
  document.getElementById('emoji-picker').style.display = emojiOpen ? 'flex' : 'none';
}
function insertEmoji(e) {
  const inp = document.getElementById('msg-input');
  inp.value += e; inp.focus();
}
document.addEventListener('click', e => {
  if (emojiOpen && !e.target.closest('#emoji-picker') && !e.target.closest('.emoji-btn')) {
    emojiOpen = false; document.getElementById('emoji-picker').style.display = 'none';
  }
});

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function scrollToBottom() {
  const el = document.getElementById('messages');
  requestAnimationFrame(() => el.scrollTop = el.scrollHeight);
}
</script>
</body>
</html>
